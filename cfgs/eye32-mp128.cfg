# 目の部分だけを切り出した 32x32 画像用 MPUNetModel (128ch)。
# データは正方形の目の切り出し画像 (32x32 でなくてもよく、読み込み時に短辺を 32 に縮小して
# 中央を切り出す)。左右反転の水増しは常に有効なので、左目と右目を 1 つのモデルで学習する前提。
# 書式は scripts/load_cfg.sh を参照 (KEY=VALUE、環境変数で指定した値が優先)。

# --- モデル ---
IMAGE_SIZE=32
NUM_CHANNELS=128
NUM_RES_BLOCKS=2
NUM_HEADS=4
NUM_HEAD_CHANNELS=64
# 32x32 では既定の channel_mult が無いので明示する (32, 16, 8, 4 の 4 段。DDPM の CIFAR-10 と同じ)。
# 4x4 のボトルネックには MPUNetModel が常に attention を入れる
CHANNEL_MULT=1,2,2,2
ATTENTION_RESOLUTIONS=16,8
DROPOUT=0.1  # 小さい画像・数万〜十万枚規模のデータでは過学習しやすいため
LEARN_SIGMA=True
CLASS_COND=False
USE_SCALE_SHIFT_NORM=True
RESBLOCK_UPDOWN=True
USE_NEW_ATTENTION_ORDER=False
USE_CHECKPOINT=False  # 32x32 ではメモリに余裕があるので勾配チェックポイントは不要
USE_FP16=False
USE_BF16=True
ARCH=mp
MP_CLIP_ACT=256
ATTR_COND=False
ATTR_FILE=""
COND_DROP_PROB=0.0
ATTR_DROP_PROB=0.0

# --- 拡散過程 ---
DIFFUSION_STEPS=1000
# cosine_shift4 は 256px 用 (64px の cosine と同じ粗さで構造を見るためのずらし)。
# 32px では通常の cosine を使う。推論側 (cycle-diffusion-for-anime-face) も cosine はそのまま扱える
NOISE_SCHEDULE=cosine

# --- 学習 ---
LR=2e-5  # ARCH=mp では使われない
WEIGHT_DECAY=0.05  # ARCH=mp では使われない
BATCH_SIZE=128  # GPU 1 枚あたり
MICROBATCH=-1
LR_ANNEAL_STEPS=200000
EMA_RATE=0.9995,0.9999
LOG_INTERVAL=100
SAVE_INTERVAL=10000
# α(t) = MP_LR_REF / sqrt(max(t / MP_LR_REF_STEPS, 1)) × warmup。
# mp128 と同じく、減衰の開始を全ステップの 14% (200k の 14% = 28k) にした初期値
MP_LR_REF=0.01
MP_LR_REF_STEPS=28000
MP_LR_WARMUP_STEPS=1000
