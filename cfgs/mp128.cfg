# 256x256 の顔画像用 MPUNetModel (128ch)。logs/anime-mp128, logs/ffhq-mp128 の設定。
# 書式は scripts/load_cfg.sh を参照 (KEY=VALUE、環境変数で指定した値が優先)。

# --- モデル ---
IMAGE_SIZE=256
NUM_CHANNELS=128
NUM_RES_BLOCKS=2
NUM_HEADS=4
NUM_HEAD_CHANNELS=64
ATTENTION_RESOLUTIONS=32,16,8
CHANNEL_MULT=""  # 空なら IMAGE_SIZE ごとの既定値 (256: 1,1,2,2,4,4)
DROPOUT=0
LEARN_SIGMA=True
CLASS_COND=False
USE_SCALE_SHIFT_NORM=True
RESBLOCK_UPDOWN=True
USE_NEW_ATTENTION_ORDER=False
USE_CHECKPOINT=True
USE_FP16=False
USE_BF16=True  # fp16 は出力付近の残差が 65504 を超えて NaN になるため bf16 を使う
# "adm" = 従来の UNetModel / "mp" = EDM2 の magnitude-preserving MPUNetModel
# (mp ではゼロから学習。LR / WEIGHT_DECAY は使わず Adam(0.9, 0.99) + 下の MP_LR_* を使う)
ARCH=mp
MP_CLIP_ACT=256
# 属性 (性別 / 顔の向き) による条件付け (ARCH=mp のみ)。ラベルは <データ>/metadata.jsonl
# (形式は guided_diffusion/attributes.py)。CFG 用に、ラベル全体を COND_DROP_PROB、
# 各属性を ATTR_DROP_PROB の確率で「指定なし」にして学習する
ATTR_COND=False
ATTR_FILE=""
COND_DROP_PROB=0.1
ATTR_DROP_PROB=0.1

# --- 拡散過程 ---
DIFFUSION_STEPS=1000
NOISE_SCHEDULE=cosine_shift4

# --- 学習 ---
LR=2e-5
WEIGHT_DECAY=0.05  # improved-diffusion と同じく AdamW の decoupled weight decay
BATCH_SIZE=32  # GPU 1 枚あたり
MICROBATCH=16
LR_ANNEAL_STEPS=100000
EMA_RATE=0.9995,0.9999
LOG_INTERVAL=10
SAVE_INTERVAL=10000
# α(t) = MP_LR_REF / sqrt(max(t / MP_LR_REF_STEPS, 1)) × warmup。EDM2 の既定値
# (0.01 / 70k iter / 約 5k iter) はバッチ 2048・約 100 万 iter 前提なので、バッチ 32・10 万ステップ向けに調整した値
MP_LR_REF=0.01
MP_LR_REF_STEPS=14000
MP_LR_WARMUP_STEPS=1000
