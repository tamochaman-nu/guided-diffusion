# モデル・拡散過程・学習のパラメータは cfgs/<名前>.cfg に書き、.env の CFG_ANIME / CFG_FFHQ で
# 選ぶ (既定は mp128)。ログは logs/<データ>-<名前> に分かれ、使った設定が train.cfg として保存される。
# 一時的に値を変えるときは docker compose run -e KEY=VALUE (cfg より優先)。

x-runtime-env: &runtime-env
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  HOME: /tmp  # passwd に無い UID でもキャッシュ等を書けるように

# ホストのユーザーで実行し、logs/ などが root 所有にならないようにする
x-user: &user "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  train-anime:
    build: &build
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel}
    image: &image guided-diffusion:${IMAGE_TAG:-latest}
    user: *user
    container_name: guided-diffusion-train-anime
    command: /bin/bash run_train.sh
    environment:
      <<: *runtime-env
      TRAIN_CFG: cfgs/${CFG_ANIME:-mp128}.cfg
      TRAIN_LOGDIR: /app/logs/anime-${CFG_ANIME:-mp128}
      RESUME_CHECKPOINT: ""  # 空ならログディレクトリの最新 modelNNNNNN.pt から再開
      EXTRA_TRAIN_FLAGS: ""
    volumes:
      - ./:/app
      - ${HOST_DATA_DIR_ANIME:-./data/anime}:/app/data
    shm_size: '8gb'
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_ANIME:-0}']  # .env の GPU_ANIME。"0,1" にすると 2 枚で 1 つの学習 (もう一方は止める)
              capabilities: [gpu]

  train-ffhq:
    build: *build
    image: *image
    user: *user
    container_name: guided-diffusion-train-ffhq
    command: /bin/bash run_train.sh
    environment:
      <<: *runtime-env
      TRAIN_CFG: cfgs/${CFG_FFHQ:-mp128}.cfg
      TRAIN_LOGDIR: /app/logs/ffhq-${CFG_FFHQ:-mp128}
      RESUME_CHECKPOINT: ""  # 空ならログディレクトリの最新 modelNNNNNN.pt から再開
      EXTRA_TRAIN_FLAGS: ""
    volumes:
      - ./:/app
      - ${HOST_DATA_DIR_FFHQ:-./data/ffhq}:/app/data
    shm_size: '8gb'
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_FFHQ:-1}']  # .env の GPU_FFHQ。"0,1" にすると 2 枚で 1 つの学習 (もう一方は止める)
              capabilities: [gpu]

  inference:
    build: *build
    image: *image
    user: *user
    container_name: guided-diffusion-inference
    command: /bin/bash run_sample.sh
    environment:
      <<: *runtime-env
      SAMPLE_LOGDIR: /app/logs/sample
      MODEL_PATH: ""
      # 空なら MODEL_PATH と同じディレクトリの train.cfg (学習時に保存された設定) を使う。
      # train.cfg が無い古いログでは cfgs/mp128.cfg などを指定する
      TRAIN_CFG: ""
      TIMESTEP_RESPACING: ""
      NUM_SAMPLES: "64"
      SAMPLE_BATCH_SIZE: "16"
      USE_DDIM: "False"
      SAVE_PNG: "True"  # npz に加えて PNG と grid.png も保存する
      # ATTR_COND=True で学習したモデル用: female/male/any, front/three_quarter/profile/any
      SAMPLE_GENDER: "any"
      SAMPLE_VIEW: "any"
      GUIDANCE_SCALE: "1.0"  # CFG の強さ (1.0 = なし)
    volumes:
      - ./:/app
    shm_size: '8gb'
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
